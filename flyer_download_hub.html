    let currentScope = 'ALL';
    let searchQuery = '';

    function renderFlyers() {
      const grid = document.getElementById('flyerGrid');
      const filtered = flyersData.filter(item => {
        if (currentScope === 'TODAY' && !item.date.includes('10.27')) return false;
        if (currentScope === 'HALLOWEEN' && !item.date.includes('10.30') && !item.date.includes('10.31')) return false;
        if (currentScope === 'UPCOMING' && item.is_past) return false;
        if (currentScope === 'PAST' && !item.is_past) return false;

        if (searchQuery) {
          const hay = `${item.club_name} ${item.title} ${item.artists} ${item.genre} ${item.area}`.toLowerCase();
          if (!hay.includes(searchQuery)) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-20 text-center text-zinc-500 space-y-2">
            <p class="text-sm font-medium">条件に一致するフライヤーがありません。</p>
            <button onclick="setScope('ALL')" class="px-4 py-1.5 rounded-xl border border-zinc-800 text-xs text-zinc-400 hover:text-white">全件表示に戻す</button>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <div class="flyer-card flex flex-col justify-between">
          <div class="relative aspect-[3/4] bg-black overflow-hidden group">
            <img src="${item.flyer}" alt="${item.title}" referrerpolicy="no-referrer" loading="lazy" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105">
            
            <div class="absolute top-2 left-2 px-2 py-0.5 rounded text-[9px] font-mono-code font-bold uppercase bg-black/85 text-zinc-200 border border-white/10 shadow">
              ${item.area}
            </div>

            ${item.is_past ? `
              <div class="absolute top-2 right-2 px-1.5 py-0.5 rounded text-[8px] font-mono-code font-bold bg-zinc-800 text-zinc-400 border border-zinc-700">終了</div>
            ` : (item.date.includes('10.27') ? `
              <div class="absolute top-2 right-2 px-1.5 py-0.5 rounded text-[8px] font-mono-code font-bold bg-red-500 text-white animate-pulse">本日</div>
            ` : '')}

            <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center p-3 gap-2">
              <button onclick="downloadFlyerFile('${item.flyer}', '${item.club_name}_${item.title}')" class="px-3.5 py-2 rounded-xl bg-amber-400 hover:bg-amber-300 text-black font-bold text-xs flex items-center gap-1.5 shadow-2xl transition transform active:scale-95">
                <span>⬇</span> 保存
              </button>
              <a href="${item.flyer}" target="_blank" rel="noopener noreferrer" class="px-3 py-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-white font-mono-code text-xs flex items-center gap-1 border border-zinc-700 transition">
                <span>↗</span>
              </a>
            </div>
          </div>

          <div class="p-3.5 space-y-2 flex-1 flex flex-col justify-between">
            <div class="space-y-1">
              <div class="flex items-center justify-between text-[10px] font-mono-code text-zinc-400">
                <span class="font-bold text-zinc-300">${item.date.split(' ')[0]}</span>
                <span class="truncate max-w-[90px]">${item.club_name}</span>
              </div>
              <h3 class="text-xs sm:text-sm font-bold text-white line-clamp-2 leading-snug" title="${item.title}">
                ${item.title}
              </h3>
            </div>

            <button onclick="downloadFlyerFile('${item.flyer}', '${item.club_name}_${item.title}')" class="w-full py-2 rounded-xl bg-zinc-800/90 hover:bg-amber-400 hover:text-black text-zinc-300 text-xs font-mono-code font-bold transition flex items-center justify-center gap-1.5 border border-zinc-700/80 mt-2">
              <span>⬇</span> フライヤー保存
            </button>
          </div>
        </div>
      `).join('');
    }

    function setScope(scope) {
      currentScope = scope;
      ['all', 'today', 'hw', 'up', 'past'].forEach(id => {
        const btn = document.getElementById(`scope-${id}`);
        if (!btn) return;
        const matches = (scope === 'ALL' && id === 'all') ||
                        (scope === 'TODAY' && id === 'today') ||
                        (scope === 'HALLOWEEN' && id === 'hw') ||
                        (scope === 'UPCOMING' && id === 'up') ||
                        (scope === 'PAST' && id === 'past');
        btn.className = matches
          ? 'px-3.5 py-1.5 rounded-xl bg-amber-400 text-black font-bold transition'
          : 'px-3.5 py-1.5 rounded-xl bg-zinc-800 text-zinc-300 hover:text-white transition';
      });
      renderFlyers();
    }

    function handleSearch(val) {
      searchQuery = val.trim().toLowerCase();
      renderFlyers();
    }

    async function downloadFlyerFile(url, suggestedName) {
      if (!url) return;
      const cleanName = (suggestedName || 'flyer')
        .replace(/[\/\\:*?"<>|]/g, '_')
        .replace(/\s+/g, '_')
        .slice(0, 50) + '.jpg';

      showDownloadToast(`「${cleanName}」の保存を開始しました...`);

      try {
        const response = await fetch(url, { mode: 'cors' });
        if (response.ok) {
          const blob = await response.blob();
          const blobUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = blobUrl;
          a.download = cleanName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(blobUrl), 2000);
          showDownloadToast(`✓ ダウンロード完了: ${cleanName}`);
          return;
        }
      } catch (err) {
        console.warn('Direct blob fetch prevented, fallback to anchor:', err);
      }

      const a = document.createElement('a');
      a.href = url;
      a.download = cleanName;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showDownloadToast(`✓ フライヤー元画像を開きました（保存可能）`);
    }

    async function downloadAllFilteredFlyers() {
      const filtered = flyersData.filter(item => {
        if (currentScope === 'TODAY' && !item.date.includes('10.27')) return false;
        if (currentScope === 'HALLOWEEN' && !item.date.includes('10.30') && !item.date.includes('10.31')) return false;
        if (currentScope === 'UPCOMING' && item.is_past) return false;
        if (currentScope === 'PAST' && !item.is_past) return false;
        return true;
      });

      if (filtered.length === 0) return;
      const count = Math.min(filtered.length, 10);
      showDownloadToast(`表示中の${count}件のフライヤーを順次ダウンロードします...`);

      for (let i = 0; i < count; i++) {
        const item = filtered[i];
        setTimeout(() => {
          downloadFlyerFile(item.flyer, `${item.club_name}_${item.title}`);
        }, i * 400);
      }
    }

    function showDownloadToast(msg) {
      let toast = document.getElementById('downloadToast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'downloadToast';
        toast.className = 'fixed bottom-6 right-6 z-[9999] px-4 py-2.5 rounded-xl bg-zinc-900/95 text-white border border-amber-400/50 text-xs font-mono-code font-bold shadow-2xl flex items-center gap-2 transform transition-all duration-300 translate-y-3 opacity-0 pointer-events-none';
        document.body.appendChild(toast);
      }
      toast.innerHTML = `<span class="text-amber-400 font-bold">⬇</span> <span>${msg}</span>`;
      toast.classList.remove('translate-y-3', 'opacity-0', 'pointer-events-none');
      if (window._toastTimer) clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.add('translate-y-3', 'opacity-0', 'pointer-events-none');
      }, 2500);
    }

    renderFlyers();
  </script>
